name: Security checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only

  audit-python:
    name: Audit Python dependencies
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and audit tool
        run: python -m pip install ".[dev]" pip-audit

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable
