name: "CodeQL advanced setup (disabled)"

on:
  # CodeQL default setup owns automatic scanning for this repository. Keeping
  # this legacy workflow manual prevents duplicate `(push)` analyses while
  # preserving the file so target-branch edits can merge normally.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ false }} # Do not run advanced setup alongside default setup.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
