name: "CodeQL advanced setup (disabled)"

on:
  # CodeQL default setup owns automatic scanning for this repository. Keeping
  # this legacy workflow manual prevents duplicate `(push)` analyses while
  # preserving the file so target-branch edits can merge normally.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ false }} # Do not run advanced setup alongside default setup.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  enable-copilot-autofix:
    name: Enable Copilot Autofix
    if: github.event_name != 'pull_request'
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Enable Copilot Autofix for CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/code-scanning/codeql/autofix/settings" \
            --field enabled=true
